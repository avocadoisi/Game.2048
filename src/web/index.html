<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>2048</title>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; background: #faf8ef; color: #776e65; }
  #grid { display: grid; grid-template-columns: repeat(4, 90px); gap: 10px; background: #bbada0; padding: 10px; width: max-content; margin: 16px auto; border-radius: 6px; }
  .cell { width: 90px; height: 90px; line-height: 90px; font-size: 28px; font-weight: bold; border-radius: 4px; background: #cdc1b4; }
  .v2 { background: #eee4da; } .v4 { background: #ede0c8; } .v8 { background: #f2b179; color: #fff; }
  .v16 { background: #f59563; color: #fff; } .v32 { background: #f67c5f; color: #fff; } .v64 { background: #f65e3b; color: #fff; }
  .big { background: #edc22e; color: #fff; font-size: 22px; }
  button { font-size: 16px; padding: 6px 14px; margin: 4px; }
  button:disabled { opacity: .45; }
  #msg { min-height: 1.5em; font-weight: bold; }
  #detail { margin: 8px auto; font-size: 12px; }
  #detail table { margin: 6px auto; border-collapse: collapse; }
  #detail td, #detail th { padding: 1px 6px; }
  #detail caption { caption-side: top; padding-bottom: 2px; }
  #detail .bar { width: 120px; background: #d9cec3; height: 9px; border-radius: 3px; }
  #detail .bar div { background: #8f7a66; height: 9px; border-radius: 3px; }
  #detail .dist { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>2048</h1>
<div>score: <span id="score">0</span></div>
<div id="grid"></div>
<div id="msg"></div>
<p>
  <button data-dir="up">↑ (W)</button><br>
  <button data-dir="left">← (A)</button>
  <button data-dir="down">↓ (S)</button>
  <button data-dir="right">→ (D)</button>
</p>
<p>
  <button id="new">New game</button>
  <button id="undo" disabled>Undo (Z)</button>
  <button id="step">Solver: 1 step</button>
  <button id="auto">Solver: auto</button>
  <label>speed <select id="speed">
    <option value="600">slow (600 ms)</option>
    <option value="300">normal (300 ms)</option>
    <option value="150" selected>fast (150 ms)</option>
    <option value="50">very fast (50 ms)</option>
    <option value="0">max (no delay)</option>
  </select></label>
</p>
<table id="policies" style="margin:8px auto;border-collapse:collapse"></table>
<p>
  <label>algorithm <select id="algo"></select></label>
</p>
<div id="detail"></div>
<script>
// Keyed by physical key (e.code) so it works under a Japanese IME, where e.key is "Process".
const CODES = { ArrowUp: "up", KeyW: "up", ArrowLeft: "left", KeyA: "left", ArrowDown: "down", KeyS: "down", ArrowRight: "right", KeyD: "right" };

function render(s) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const row of s.board) for (const v of row) {
    const c = document.createElement("div");
    const cls = v === 0 ? "" : v > 64 ? "big" : "v" + v;
    c.className = "cell " + cls;
    c.textContent = v === 0 ? "" : v;
    grid.appendChild(c);
  }
  document.getElementById("score").textContent = s.score;
  document.getElementById("msg").textContent = s.game_over ? "Game over — press New game" : (s.changed === false && s.moved ? "no change" : "");
  // Undo is offered while the server still remembers a position; it drops the oldest after 20.
  document.getElementById("undo").disabled = !s.undo;
}

async function call(method, url) {
  const res = await fetch(url, { method });
  const body = await res.json();
  if (!res.ok) { document.getElementById("msg").textContent = "error: " + res.status; return; }
  body.moved = url.includes("/api/move");
  render(body);
}

// Policy ranking from the server (generated by `zig build ranking`): the algo picker, the comparison
// table and the detail below all read the same entries, so they cannot describe different runs.
let ranked = [];
const REACH_TILES = [256, 512, 1024, 2048, 4096, 8192, 16384];
const pct = (n, d) => (d ? Math.round((100 * n) / d) : 0);
const num = (v) => (typeof v === "number" ? Math.round(v).toLocaleString() : "-");
const bar = (p) => `<td class="bar"><div style="width:${p}%"></div></td><td>${p}%</td>`;

// The selected model's score, in detail: the spread of its games, the tiles those games reached and
// the score bands they ended in. Reach and the average score of the games that got there are suffix
// sums of the same per-final-tile bins (`max_tiles`), so neither can drift from the other (#371).
function showDetail() {
  const box = document.getElementById("detail");
  const e = ranked.find((x) => x.policy === document.getElementById("algo").value);
  if (!e || !e.games) { box.innerHTML = ""; return; }
  const games = e.games;
  const dist = `<div class="dist">${e.policy} — ${games} games: avg ${num(e.avg_score)} / median ${num(e.median_score)} / min ${num(e.min_score)} / max ${num(e.max_score)} / sd ${num(e.stddev_score)}</div>`;
  const tiles = REACH_TILES.map((tile) => {
    const bins = (e.max_tiles || []).filter((b) => b.tile >= tile);
    const reached = bins.reduce((n, b) => n + b.games, 0);
    const avg = reached ? bins.reduce((n, b) => n + b.avg_score * b.games, 0) / reached : 0;
    return `<tr><td>${tile}</td>${bar(pct(reached, games))}<td>${reached ? num(avg) : "-"}</td></tr>`;
  }).join("");
  const bands = (e.score_bands || []).map((b) => `<tr><td>${b.from / 1000}k–${b.to / 1000}k</td>${bar(pct(b.games, games))}</tr>`).join("");
  box.innerHTML =
    `${dist}
    <table><caption>reached at least — share of its games</caption>
      <tr><th>tile</th><th></th><th></th><th>avg score</th></tr>${tiles}</table>
    ${bands ? `<table><caption>score bands — where its games ended</caption>${bands}</table>` : ""}`;
}

fetch("/api/ranking").then((r) => r.json()).then((data) => {
  ranked = data.entries;
  const { games_per_run, runs } = data;
  // every ranked policy is selectable for the solver
  document.getElementById("algo").innerHTML = ranked.map((e) => `<option value="${e.policy}"${e.policy === "expectimax" ? " selected" : ""}>${e.policy}</option>`).join("");
  // games/s and ms/move come from the same run as avg score (`zig build ranking`);
  // an older ranking.json without them still renders, with "-".
  const speed = (e) => (typeof e.games_per_sec === "number" ? e.games_per_sec.toFixed(2) : "-");
  const latency = (e) => (typeof e.latency_ms_per_move === "number" ? e.latency_ms_per_move.toFixed(2) : "-");
  const rows = ranked.map((e, i) => `<tr><td>${i + 1}</td><td>${e.policy}</td><td>${e.avg_score.toFixed(0)}</td><td>${e.best_tile}</td><td>${speed(e)}</td><td>${latency(e)}</td><td style="text-align:left">${e.description}</td></tr>`).join("");
  document.getElementById("policies").innerHTML = `<tr><th>#</th><th>policy</th><th>avg score</th><th>best tile</th><th>games/s</th><th>ms/move</th><th>what it does</th></tr>${rows}<caption>${runs} runs x ${games_per_run} games, fixed seed — avg score and speed from the same run</caption>`;
  showDetail();
});
document.getElementById("algo").addEventListener("change", showDetail);

for (const b of document.querySelectorAll("[data-dir]")) {
  b.addEventListener("click", () => call("POST", "/api/move?dir=" + b.dataset.dir));
}
document.getElementById("new").addEventListener("click", () => call("POST", "/api/new"));
// Undo: the server keeps the last 20 positions (a no-op move does not push one).
function undo() {
  stopAuto();
  call("POST", "/api/undo");
}
document.getElementById("undo").addEventListener("click", undo);

// Solver preview: ask the server for the expectimax move, then apply it.
let running = false;
async function solveStep() {
  const algo = document.getElementById("algo").value;
  const res = await fetch("/api/solve?algo=" + algo + "&depth=2");
  if (!res.ok) { document.getElementById("msg").textContent = "solver error: " + res.status; return false; }
  const { dir } = await res.json();
  if (dir === null) { stopAuto(); document.getElementById("msg").textContent = "solver: no move (game over)"; return false; }
  await call("POST", "/api/move?dir=" + dir);
  return true;
}
function stopAuto() { running = false; document.getElementById("auto").textContent = "Solver: auto"; }
// One request at a time; the speed select is read on every step, so changes apply at once.
async function autoLoop() {
  while (running) {
    if (!await solveStep()) break;
    const delay = Number(document.getElementById("speed").value);
    if (delay > 0) await new Promise((resolve) => setTimeout(resolve, delay));
  }
}
document.getElementById("step").addEventListener("click", () => solveStep());
document.getElementById("auto").addEventListener("click", () => {
  if (running) return stopAuto();
  running = true;
  document.getElementById("auto").textContent = "Solver: stop";
  autoLoop();
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // A focused <select> owns its arrow keys; do not turn them into board moves.
  if (e.target instanceof Element && e.target.closest("select, input, button")) return;
  if (e.code === "KeyZ") { e.preventDefault(); return undo(); }
  const dir = CODES[e.code];
  if (dir) { e.preventDefault(); call("POST", "/api/move?dir=" + dir); }
});
call("GET", "/api/state");
</script>
</body>
</html>
