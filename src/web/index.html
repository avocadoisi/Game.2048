<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>2048</title>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; background: #faf8ef; color: #776e65; }
  #grid { display: grid; grid-template-columns: repeat(4, 90px); gap: 10px; background: #bbada0; padding: 10px; width: max-content; margin: 16px auto; border-radius: 6px; }
  .cell { width: 90px; height: 90px; line-height: 90px; font-size: 28px; font-weight: bold; border-radius: 4px; background: #cdc1b4; }
  .v2 { background: #eee4da; } .v4 { background: #ede0c8; } .v8 { background: #f2b179; color: #fff; }
  .v16 { background: #f59563; color: #fff; } .v32 { background: #f67c5f; color: #fff; } .v64 { background: #f65e3b; color: #fff; }
  .big { background: #edc22e; color: #fff; font-size: 22px; }
  button { font-size: 16px; padding: 6px 14px; margin: 4px; }
  #msg { min-height: 1.5em; font-weight: bold; }
</style>
</head>
<body>
<h1>2048</h1>
<div>score: <span id="score">0</span></div>
<div id="grid"></div>
<div id="msg"></div>
<p>
  <button data-dir="up">↑ (W)</button><br>
  <button data-dir="left">← (A)</button>
  <button data-dir="down">↓ (S)</button>
  <button data-dir="right">→ (D)</button>
</p>
<p>
  <button id="new">New game</button>
  <button id="step">Solver: 1 step</button>
  <button id="auto">Solver: auto</button>
  <label>speed <select id="speed">
    <option value="600">slow (600 ms)</option>
    <option value="300">normal (300 ms)</option>
    <option value="150" selected>fast (150 ms)</option>
    <option value="50">very fast (50 ms)</option>
    <option value="0">max (no delay)</option>
  </select></label>
</p>
<table id="policies" style="margin:8px auto;border-collapse:collapse"></table>
<p>
  <label>algorithm <select id="algo"></select></label>
</p>
<script>
const KEYS = { ArrowUp: "up", w: "up", ArrowLeft: "left", a: "left", ArrowDown: "down", s: "down", ArrowRight: "right", d: "right" };

function render(s) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const row of s.board) for (const v of row) {
    const c = document.createElement("div");
    const cls = v === 0 ? "" : v > 64 ? "big" : "v" + v;
    c.className = "cell " + cls;
    c.textContent = v === 0 ? "" : v;
    grid.appendChild(c);
  }
  document.getElementById("score").textContent = s.score;
  document.getElementById("msg").textContent = s.game_over ? "Game over — press New game" : "";
}

async function call(method, url) {
  const res = await fetch(url, { method });
  const body = await res.json();
  if (!res.ok) { document.getElementById("msg").textContent = "error: " + res.status; return; }
  render(body);
}

// Policy ranking from the server (generated by `zig build ranking`).
fetch("/api/ranking").then((r) => r.json()).then(({ entries, games_per_run, runs }) => {
  // every ranked policy is selectable for the solver
  document.getElementById("algo").innerHTML = entries.map((e) => `<option value="${e.policy}"${e.policy === "expectimax" ? " selected" : ""}>${e.policy}</option>`).join("");
  const rows = entries.map((e, i) => `<tr><td>${i + 1}</td><td>${e.policy}</td><td>${e.avg_score.toFixed(0)}</td><td>${e.best_tile}</td><td style="text-align:left">${e.description}</td></tr>`).join("");
  document.getElementById("policies").innerHTML = `<tr><th>#</th><th>policy</th><th>avg score</th><th>best tile</th><th>what it does</th></tr>${rows}<caption>${runs} runs x ${games_per_run} games, fixed seed</caption>`;
});

for (const b of document.querySelectorAll("[data-dir]")) {
  b.addEventListener("click", () => call("POST", "/api/move?dir=" + b.dataset.dir));
}
document.getElementById("new").addEventListener("click", () => call("POST", "/api/new"));

// Solver preview: ask the server for the expectimax move, then apply it.
let running = false;
async function solveStep() {
  const algo = document.getElementById("algo").value;
  const res = await fetch("/api/solve?algo=" + algo + "&depth=2");
  if (!res.ok) { document.getElementById("msg").textContent = "solver error: " + res.status; return false; }
  const { dir } = await res.json();
  if (dir === null) { stopAuto(); document.getElementById("msg").textContent = "solver: no move (game over)"; return false; }
  await call("POST", "/api/move?dir=" + dir);
  return true;
}
function stopAuto() { running = false; document.getElementById("auto").textContent = "Solver: auto"; }
// One request at a time; the speed select is read on every step, so changes apply at once.
async function autoLoop() {
  while (running) {
    if (!await solveStep()) break;
    const delay = Number(document.getElementById("speed").value);
    if (delay > 0) await new Promise((resolve) => setTimeout(resolve, delay));
  }
}
document.getElementById("step").addEventListener("click", () => solveStep());
document.getElementById("auto").addEventListener("click", () => {
  if (running) return stopAuto();
  running = true;
  document.getElementById("auto").textContent = "Solver: stop";
  autoLoop();
});
document.addEventListener("keydown", (e) => {
  const dir = KEYS[e.key] || KEYS[e.key.toLowerCase()];
  if (dir) { e.preventDefault(); call("POST", "/api/move?dir=" + dir); }
});
call("GET", "/api/state");
</script>
</body>
</html>
