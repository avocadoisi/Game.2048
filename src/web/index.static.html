<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>2048</title>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; background: #faf8ef; color: #776e65; }
  :root { --tile-size: min(110px, calc(22vw - 8px)); --tile-gap: clamp(8px, 2.4vw, 12px); }
  #grid { display: grid; grid-template-columns: repeat(4, var(--tile-size)); gap: var(--tile-gap); background: #bbada0; padding: var(--tile-gap); width: max-content; margin: 16px auto; border-radius: 6px; touch-action: none; }
  .cell { width: var(--tile-size); height: var(--tile-size); line-height: var(--tile-size); font-size: clamp(22px, 6.4vw, 34px); font-weight: bold; border-radius: 4px; background: #cdc1b4; }
  .v2 { background: #eee4da; } .v4 { background: #ede0c8; } .v8 { background: #f2b179; color: #fff; }
  .v16 { background: #f59563; color: #fff; } .v32 { background: #f67c5f; color: #fff; } .v64 { background: #f65e3b; color: #fff; }
  .big { background: #edc22e; color: #fff; font-size: clamp(18px, 5.2vw, 26px); }
  .animations-enabled .cell.changed { animation: tile-pop 220ms ease-out; }
  @keyframes tile-pop {
    0% { transform: scale(.82); box-shadow: 0 0 0 4px #f4cd42; }
    55% { transform: scale(1.08); box-shadow: 0 0 0 2px #f4cd42; }
    100% { transform: scale(1); box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    .animations-enabled .cell.changed { animation: none; }
  }
  button { font-size: 16px; padding: 6px 14px; margin: 4px; }
  button:disabled { opacity: .45; }
  #msg { min-height: 1.5em; font-weight: bold; }
  #policy-desc { font-size: 12px; line-height: 1.4; color: #8f857d; max-width: 34em; margin: 0 auto; }
  #reach { margin: 6px auto; border-collapse: collapse; font-size: 12px; color: #8f857d; }
  #reach td { padding: 1px 6px; }
  #reach .bar { width: min(150px, 40vw); background: #d9cec3; height: 9px; border-radius: 3px; }
  #reach .bar div { background: #8f7a66; height: 9px; border-radius: 3px; }
</style>
</head>
<body class="animations-enabled">
<h1>2048</h1>
<div>score: <span id="score">0</span> — best tile: <span id="best">0</span></div>
<div id="grid"></div>
<p id="controls-hint">Use WASD keys or swipe on the board</p>
<div id="msg"></div>
<p>
  <button id="new">New game</button>
  <button id="undo" disabled>Undo (Z)</button>
  <button id="step">Solver: 1 step</button>
  <button id="auto">Solver: auto</button>
  <label><input id="animation-toggle" type="checkbox" checked> Tile animation</label>
</p>
<p>
  <label>policy <select id="policy"></select></label>
  <label>speed <select id="speed">
    <option value="0">max (no delay)</option>
    <option value="250">slow (250 ms)</option>
    <option value="500">slower (500 ms)</option>
  </select></label>
</p>
<p id="policy-desc"></p>
<table id="reach"></table>
<script type="module">
import { RootWorkerPool } from "./search-workers.mjs";
// Static build: everything runs in WebAssembly, there is no server.
// Exports follow src/wasm.zig: move returns 0 no change, 1 moved, 2 game over.
const CODES = { ArrowUp: 0, KeyW: 0, ArrowLeft: 1, KeyA: 1, ArrowDown: 2, KeyS: 2, ArrowRight: 3, KeyD: 3 };
const NO_CHANGE = 0, MOVED = 1, GAME_OVER = 2;
const SWIPE_THRESHOLD = 30;
const animationToggle = document.getElementById("animation-toggle");
animationToggle.addEventListener("change", () => {
  document.body.classList.toggle("animations-enabled", animationToggle.checked);
});

let w; // wasm exports
let workerPool = null;
let revision = 0;
let autoEpoch = 0;
let gameOver = false;
let previousBoard = null;

function render() {
  const board = new Uint32Array(w.memory.buffer, w.board_ptr(), 16);
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const [i, v] of board.entries()) {
    const c = document.createElement("div");
    const changed = previousBoard !== null && previousBoard[i] !== v && v !== 0;
    c.className = "cell " + (v === 0 ? "" : v > 64 ? "big" : "v" + v) + (changed ? " changed" : "");
    c.textContent = v === 0 ? "" : v;
    grid.appendChild(c);
  }
  previousBoard = Array.from(board);
  document.getElementById("score").textContent = w.score();
  document.getElementById("best").textContent = w.best_tile();
  document.getElementById("msg").textContent = gameOver ? "Game over — press New game" : "";
  // The module remembers the last 20 positions; the button is offered only while one is left.
  document.getElementById("undo").disabled = w.undo_count() === 0;
}

function move(dir, paint = true) {
  revision++;
  if (gameOver) return false;
  const result = w.move(dir);
  gameOver = result === GAME_OVER;
  if (result === NO_CHANGE) document.getElementById("msg").textContent = "no change";
  if (paint) render();
  return result !== NO_CHANGE;
}

function directionFromSwipe(dx, dy) {
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if (Math.max(absX, absY) < SWIPE_THRESHOLD) return null;
  return absX > absY ? (dx < 0 ? 1 : 3) : (dy < 0 ? 0 : 2);
}

function newGame() {
  revision++;
  // crypto seed when available, fixed mix otherwise
  const seed = crypto.getRandomValues(new Uint32Array(2));
  w.init(seed[0], seed[1]);
  gameOver = false;
  previousBoard = null;
  render();
}

// Undo: step back through the last 20 positions the module kept (`undo` = 1 when the board moved
// back). A restored board can be playable again, so gameOver is cleared and nothing stays marked.
function undoMove() {
  stopAuto();
  revision++;
  if (w.undo() !== 1) return;
  gameOver = false;
  previousBoard = null;
  render();
}

// Solver preview: ask the wasm solver for the move, then apply it.
// The policy list comes straight from the module (`wasm.policies`): the page offers exactly what
// was compiled in, so a policy the module does not ship cannot be selected by mistake (#154).
// Default is nn3 (native 152,463 vs nn2's 141,885 on the README's 20+20 protocol) at 4-400 ms
// per move in V8; nn2 is 9-14 ms, which is why both exist next to the speed picker (issue #152).
const DEFAULT_POLICY = "nn3";
const FRAME_BUDGET_MS = 8;
let running = false;
let autoFrame = 0; // pending requestAnimationFrame id, 0 when none is queued
let nextMoveAt = 0;

function policyIndex() { return Number(document.getElementById("policy").value); }

async function solverMove() {
  const current = ++revision;
  const algo = policyIndex();
  let dir;
  const policy = document.getElementById("policy").selectedOptions[0]?.textContent;
  if (workerPool && (policy === "nn2" || policy === "nn3")) {
    const board = new Uint32Array(w.memory.buffer, w.board_ptr(), 16).slice();
    try {
      dir = await workerPool.solve(board, algo);
    } catch (error) {
      console.warn("worker solver unavailable; falling back to serial", error);
      workerPool = null;
      if (current !== revision) return null;
      dir = w.solve(algo, 0);
    }
  } else {
    dir = w.solve(algo, 0);
  }
  if (current !== revision) return null;
  if (dir < 0) return false;
  return move(dir, false);
}

async function solveStep() {
  const ok = await solverMove();
  if (ok === null) return null;
  render();
  if (!ok) {
    stopAuto();
    document.getElementById("msg").textContent = "solver: no move (game over)";
  }
  return ok;
}

// One loop at a time: the pending frame is cancelled here, so a stop/start pair inside one task
// cannot leave two loops scheduling themselves. `nextMoveAt = 0` is in the past for every rAF
// timestamp, so the next start fires its first move on the first frame.
function stopAuto() {
  revision++;
  autoEpoch++;
  running = false;
  if (autoFrame) { cancelAnimationFrame(autoFrame); autoFrame = 0; }
  nextMoveAt = 0;
  document.getElementById("auto").textContent = "Solver: auto";
}

function speedDelay() { return Number(document.getElementById("speed").value); }

// Auto play, one animation frame at a time. At "max" there is no artificial delay, but at most
// FRAME_BUDGET_MS of solving per frame so the tab keeps painting and the buttons stay clickable.
// With a delay, one move per frame at most, and the timer restarts after the solve returns, so a
// slow policy (nn3 is 0.3 s per move early on) is never charged the delay twice.
async function autoLoop(now) {
  if (!running) return;
  const epoch = autoEpoch;
  const delay = speedDelay();
  let moved = false;
  if (delay === 0) {
    const start = performance.now();
    while (running && epoch === autoEpoch && performance.now() - start < FRAME_BUDGET_MS) {
      const result = await solverMove();
      if (epoch !== autoEpoch) return;
      if (result === false) { stopAuto(); break; }
      if (result === null) break;
      moved = true;
    }
  } else if (now >= nextMoveAt) {
    const result = await solverMove();
    if (epoch !== autoEpoch) return;
    if (result === false) stopAuto();
    moved = result === true;
    nextMoveAt = performance.now() + delay;
  }
  if (moved || !running) render();
  if (running && epoch === autoEpoch) autoFrame = requestAnimationFrame(autoLoop);
}

// Reach ladder under the policy picker: how far the measured games of this policy got. The pairs
// come from `algo_reach` / `solver.policy_info.reach` ("2048=95,4096=88,…", share of the games that
// reached at least the tile), so the page never invents a curve (issue #369).
function showReach(spec) {
  const table = document.getElementById("reach");
  const pairs = (spec || "").split(",").filter(Boolean).map((pair) => pair.split("=").map(Number));
  if (pairs.length === 0) { table.innerHTML = ""; return; }
  const rows = pairs.map(([tile, pct]) => `<tr><td>${tile}</td><td class="bar"><div style="width:${pct}%"></div></td><td>${pct}%</td></tr>`).join("");
  table.innerHTML = `<caption>reached at least — share of the measured games</caption>${rows}`;
}

(async () => {
  const bytes = await (await fetch("game2048.wasm")).arrayBuffer();
  const module = await WebAssembly.compile(bytes);
  const instance = await WebAssembly.instantiate(module, {});
  w = instance.exports;
  if (new URLSearchParams(location.search).get("workers") === "1" && typeof Worker !== "undefined") {
    try { workerPool = new RootWorkerPool(module); }
    catch (error) { console.warn("worker solver unavailable; using serial", error); }
  }

  // One entry per policy compiled into this module, with its measured average score.
  const text = (ptr, len) => new TextDecoder().decode(new Uint8Array(w.memory.buffer, ptr, len));
  const policies = [];
  for (let i = 0; i < w.algo_count(); i++) {
    policies.push({
      name: text(w.algo_name(i), w.algo_name_len(i)),
      score: text(w.algo_score(i), w.algo_score_len(i)),
      speed: text(w.algo_speed(i), w.algo_speed_len(i)),
      reach: text(w.algo_reach(i), w.algo_reach_len(i)),
    });
  }
  const picker = document.getElementById("policy");
  picker.innerHTML = "";
  for (const [i, p] of policies.entries()) {
    const option = document.createElement("option");
    option.value = String(i);
    option.textContent = p.name;
    option.title = p.speed ? `${p.score} / 1 手 ${p.speed}` : p.score;
    picker.appendChild(option);
  }
  const preferred = policies.findIndex((p) => p.name === DEFAULT_POLICY);
  picker.value = String(preferred >= 0 ? preferred : policies.length - 1);
  const showPolicy = () => {
    const p = policies[policyIndex()];
    if (!p) return void (document.getElementById("policy-desc").textContent = "");
    // Score first (how strong), then the measured cost per move (how slow) — nothing else.
    const speed = p.speed ? ` / 1 手 ${p.speed}` : "";
    document.getElementById("policy-desc").textContent = `${p.name}: ${p.score}${speed}`;
    showReach(p.reach);
  };
  picker.addEventListener("change", () => { revision++; showPolicy(); });
  showPolicy();

  const grid = document.getElementById("grid");
  let swipeStart = null;
  grid.addEventListener("pointerdown", (event) => {
    if (!event.isPrimary || event.pointerType === "mouse") return;
    swipeStart = { pointerId: event.pointerId, x: event.clientX, y: event.clientY };
  });
  document.addEventListener("pointerup", (event) => {
    if (!swipeStart || event.pointerId !== swipeStart.pointerId) return;
    const dx = event.clientX - swipeStart.x;
    const dy = event.clientY - swipeStart.y;
    swipeStart = null;
    const dir = directionFromSwipe(dx, dy);
    if (dir !== null) move(dir);
  });
  document.addEventListener("pointercancel", (event) => {
    if (swipeStart?.pointerId === event.pointerId) swipeStart = null;
  });
  document.getElementById("new").addEventListener("click", newGame);
  document.getElementById("undo").addEventListener("click", undoMove);
  document.getElementById("step").addEventListener("click", () => { stopAuto(); solveStep(); });
  document.getElementById("auto").addEventListener("click", () => {
    if (running) return stopAuto();
    running = true;
    document.getElementById("auto").textContent = "Solver: stop";
    autoFrame = requestAnimationFrame(autoLoop);
  });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    // A focused <select> owns its arrow keys; do not turn them into board moves.
    if (e.target instanceof Element && e.target.closest("select, input, button")) return;
    if (e.code === "KeyZ") { e.preventDefault(); return undoMove(); }
    const dir = CODES[e.code];
    if (dir !== undefined) { e.preventDefault(); move(dir); }
  });

  newGame();
})();
</script>
</body>
</html>
